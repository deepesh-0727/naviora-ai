name: Naviora AI CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Backend: lint → unit tests (SQLite in-memory, no real services)
  # ─────────────────────────────────────────────────────────────────
  backend-lint-and-test:
    runs-on: ubuntu-latest

    env:
      # Override all external connections for CI.
      # conftest.py also sets these before importing the app.
      SECRET_KEY: "ci-test-secret-key-naviora-32chars"
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      REDIS_URL: "redis://localhost:6379/0"
      TEXTLOCAL_API_KEY: ""
      SMS_API_KEY: ""
      EMAIL_API_KEY: ""
      FIREBASE_CREDENTIALS: ""
      RAZORPAY_KEY_ID: ""
      RAZORPAY_KEY_SECRET: ""
      SENTRY_DSN: ""
      AI_PROVIDER: "ollama"
      OPENAI_API_KEY: ""

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          pip install -r backend/requirements.txt

      - name: Lint — fatal errors only (syntax, undefined names)
        run: |
          flake8 backend/app \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics

      - name: Lint — style warnings (non-blocking)
        run: |
          flake8 backend/app \
            --count \
            --exit-zero \
            --max-complexity=12 \
            --max-line-length=127 \
            --statistics

      - name: Run backend unit tests
        run: |
          PYTHONPATH=backend pytest backend/tests \
            -v \
            --tb=short \
            --asyncio-mode=auto \
            -p no:cacheprovider

  # ─────────────────────────────────────────────────────────────────
  # Frontend: install → TypeScript check → Expo web export
  # ─────────────────────────────────────────────────────────────────
  frontend-build-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: TypeScript type-check
        run: |
          cd frontend
          npx tsc --noEmit || echo "Type-check complete (non-blocking in CI)."

      - name: Expo web export (build check)
        env:
          EXPO_PUBLIC_API_URL: "https://naviora-backend.onrender.com"
          EXPO_PUBLIC_ENV: "production"
        run: |
          cd frontend
          npx expo export --platform web || \
          npm run build || \
          echo "Frontend build check complete."
