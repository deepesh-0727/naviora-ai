name: CI

on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SECRET_KEY: ci-test-secret-key-naviora-32chars
      DATABASE_URL: 'postgresql+asyncpg://postgres:test@localhost:5432/test'
      # CI-only generated keys; never use for production data.
      ENCRYPTION_KEY: 'JzzkGU_9lsgJzY5x_gsH7Gp_VA6WkPIkohf-ZS7LIEg='
      BACKUP_ENCRYPTION_KEY: 'XNnpxhb1KTnJBHs68rKezW7MZyJo-MwIdmaa7aIrlDk='
      REDIS_URL: redis://localhost:6379/0
      NAVIORA_TEST_REDIS_URL: redis://localhost:6379/0
      TEXTLOCAL_API_KEY: ''
      SMS_API_KEY: ''
      EMAIL_API_KEY: ''
      FIREBASE_CREDENTIALS: ''
      RAZORPAY_KEY_ID: ''
      RAZORPAY_KEY_SECRET: ''
      SENTRY_DSN: ''
      AI_PROVIDER: ollama
      OPENAI_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt
          pip install flake8
      - name: Lint fatal errors
        run: flake8 backend/app --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Test with coverage gate
        run: PYTHONPATH=backend python -m pytest backend/tests -v --tb=short --asyncio-mode=auto --cov=app --cov-fail-under=70

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: cd frontend && npm ci --legacy-peer-deps
      - name: TypeScript check
        run: cd frontend && npx tsc --noEmit
      - name: Frontend unit tests
        run: cd frontend && npm test -- --ci
