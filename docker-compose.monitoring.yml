version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: naviora_prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: naviora_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=adminpassword
    restart: unless-stopped

  node_exporter:
    image: prom/node-exporter:latest
    container_name: naviora_node_exporter
    ports:
      - "9100:9100"
    restart: unless-stopped
